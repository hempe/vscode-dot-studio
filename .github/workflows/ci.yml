name: CI

# Typecheck, test and build on every push to master and every pull request.
# Linux and Windows are both gates.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Several tests run the real dotnet CLI (they skip themselves without it), and the .NET 8 and 10 SDKs are the ones the extension targets
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: npm ci
      - run: npm run typecheck
      # The github-actions reporter turns failing tests into annotations on the run
      - run: npm test -- --reporters=default --reporters=github-actions --json --outputFile=jest.json
      # Suite-level failures (crashes, setup errors) produce no annotation from the reporter, so list them from the JSON result
      - if: failure()
        run: node scripts/ci/annotate-jest.js
      # The production build (webpack, extension and webviews), as `vsce package` runs it
      - run: npm run build

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Proves that a .vsix can be built from this commit; the file is kept for download
      - run: npx vsce package --no-dependencies --out shinobi-dotnet-ci.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: shinobi-dotnet-ci.vsix
          retention-days: 14
