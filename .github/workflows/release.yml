name: Release

# Publish a release on GitHub (Releases > Draft a new release > choose or create the tag, e.g. v0.1.0 > Publish release);
# tick "Set as a pre-release" for a pre-release. The version comes from the tag (package.json is not edited in git), and
# the same .vsix goes to the Visual Studio Marketplace, Open VSX and the GitHub release. Release notes left empty are
# filled from the CHANGELOG.md section of that version.
# A store is skipped while its token secret (VSCE_PAT, OVSX_PAT) is not set, so the workflow works before the accounts exist.
# Open VSX can also publish without any token (trusted publishing, OIDC): register this workflow at
# open-vsx.org/user-settings/trusted-publishers and set the repository variable OVSX_TRUSTED_PUBLISHING to true, see RELEASING.md.
# VSCE_PAT stays unset for now (an Azure DevOps organization needs an Azure subscription): the .vsix attached to the release
# is uploaded to the Visual Studio Marketplace by hand, see RELEASING.md.
# Two jobs: `build` (npm ci, tests, webpack: code of ~900 dev packages) has no secrets and a read-only token and hands the .vsix
# on as an artifact; `publish` has the tokens and the OIDC identity but runs no project code, only the locked vsce/ovsx.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "The tag must look like v1.2.3 (or 1.2.3), not $TAG" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Only commits of master are released
        shell: bash
        run: |
          if ! git branch -r --contains "$(git rev-parse HEAD)" | grep -qx '  origin/master'; then
            echo "The tagged commit is not on master" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Fails when the version has no changelog entry (the Marketplace shows CHANGELOG.md too)
      - name: Changelog section
        run: node scripts/release-notes.js "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Package
        shell: bash
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--pre-release); fi
          npx vsce package "${{ steps.version.outputs.version }}" --no-git-tag-version --no-update-package-json --no-dependencies --baseContentUrl "https://github.com/hempe/vscode-dot-studio/blob/$TAG" --baseImagesUrl "https://github.com/hempe/vscode-dot-studio/raw/$TAG" "${flags[@]}" --out shinobi-dotnet.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            shinobi-dotnet.vsix
            release-notes.md
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The `release` environment is created on the first run; register it in the Open VSX trusted publisher (RELEASING.md)
    environment: release
    permissions:
      contents: write # attach the .vsix to the release
      id-token: write # only used by the Open VSX trusted publishing step
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      # Only for the locked vsce and ovsx; --ignore-scripts: no install script of any package runs next to the tokens
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v7
        with:
          name: release

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        shell: bash
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--pre-release); fi
          npx vsce publish --packagePath shinobi-dotnet.vsix --pat "$VSCE_PAT" "${flags[@]}"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        shell: bash
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--pre-release); fi
          npx ovsx publish shinobi-dotnet.vsix --pat "$OVSX_PAT" "${flags[@]}"

      # No stored token: the job asks GitHub for a short-lived OIDC identity and Open VSX exchanges it for a one-extension
      # publishing token. Only runs when OVSX_TRUSTED_PUBLISHING is true and no OVSX_PAT is set (a PAT would take precedence).
      - name: Publish to Open VSX (trusted publishing)
        if: ${{ vars.OVSX_TRUSTED_PUBLISHING == 'true' && env.OVSX_PAT == '' }}
        shell: bash
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--pre-release); fi
          npx ovsx publish shinobi-dotnet.vsix --trusted-publishing "${flags[@]}"

      - name: Attach the .vsix to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" shinobi-dotnet.vsix --clobber
          if [[ -z "$(gh release view "$TAG" --json body --jq .body | tr -d '[:space:]')" ]]; then
            gh release edit "$TAG" --notes-file release-notes.md
          fi

      - name: Which stores got it
        shell: bash
        run: |
          marketplace="skipped, no VSCE_PAT secret"; if [[ -n "$VSCE_PAT" ]]; then marketplace="yes"; fi
          openvsx="skipped, no OVSX_PAT secret and trusted publishing is off"
          if [[ -n "$OVSX_PAT" ]]; then openvsx="yes, with the OVSX_PAT token"; elif [[ "${{ vars.OVSX_TRUSTED_PUBLISHING }}" == "true" ]]; then openvsx="yes, trusted publishing"; fi
          {
            echo "## Released ${{ needs.build.outputs.version }}"
            echo "- GitHub release: yes"
            echo "- Visual Studio Marketplace: $marketplace"
            echo "- Open VSX: $openvsx"
          } >> "$GITHUB_STEP_SUMMARY"
